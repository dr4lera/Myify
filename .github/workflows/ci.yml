name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Parse Windows scripts
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $failed=$false
          Get-ChildItem -Recurse -Include *.ps1,*.psm1 | ForEach-Object {
            $parseErrors=$null; $tokens=$null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$parseErrors) | Out-Null
            if($parseErrors){$parseErrors | Format-List; $failed=$true}
          }
          if($failed){throw 'PowerShell parsing failed'}
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          python -m pip install -r desktop/requirements.txt
          python -m unittest discover -s desktop/tests -v
          .\tests\launcher.test.ps1
          python lrc-maker/download_models.py
          .\Build-Desktop.ps1
          python tests/packaged_startup.py dist/desktop-build/MyifyDesktop/MyifyDesktop.exe
          $compiler=Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if(-not(Test-Path -LiteralPath $compiler)){
            choco install innosetup --yes --no-progress
            if($LASTEXITCODE -ne 0){throw 'Inno Setup installation failed'}
          }
          .\Build-Installer.ps1 -InnoCompiler $compiler
